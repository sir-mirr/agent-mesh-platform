name: CI

on:
  push:
    branches: [main]
  pull_request:

  # **Re-run the current tree, without committing to it.**
  #
  # The reason first written here was that CI could not be re-requested at all.
  # That was wrong and was carried across three agents unchecked: `gh run rerun`
  # exists and works — measured. What it does *not* do is say when it has not
  # worked. On a run that expired against the job budget it returns exit 0,
  # prints nothing, and starts nothing; on a completed run the same command with
  # the same exit code queues one. So the capability looked absent because its
  # failure is silent, which is worse than absent — an absent tool sends you
  # looking, a silent one lets you believe it worked.
  #
  # This is still worth having, for the thing `rerun` cannot do: `rerun` replays
  # an old run, and every case today wanted the *current* tree re-examined. And
  # expired runs, which is what today's were, are exactly what `rerun` declines.
  #
  # It also separates two questions that look alike from outside — *is this tree
  # broken* and *was that run unlucky* — which cannot be told apart while
  # re-running requires a new commit, because the new commit is a different
  # tree.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test packages/

      # Integration tests start real hub and http processes on ephemeral ports.
      # Kept as a separate step so a failure here is distinguishable at a glance
      # from a unit failure — they fail for very different reasons.
      - name: Integration tests
        run: bun test test/

      # The guards checked against the defects they exist for. Moving these into
      # the repository was supposed to make "this was mutation-tested" a
      # checkable claim; a manifest nothing runs decays exactly the way the
      # documentation it replaced did.
      #
      # It edits tracked files and restores with `git checkout --`, which is
      # safe on a fresh checkout and refuses outright on a dirty tree.
      - name: Mutation check
        run: bun run mutation-check

      # The tool checking its own reporting branch. Added after `18/18 caught`
      # was reported while the code that prints a failure had never run.
      - name: Mutation check — self-check
        run: bun run mutation-check -- --self-check
