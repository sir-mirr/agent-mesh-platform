name: CI

on:
  push:
    branches: [main]
  pull_request:

  # **Re-run the current tree, without committing to it.**
  #
  # That is the whole reason, and it took two wrong ones to get here.
  #
  # The first was that CI could not be re-requested at all. Three agents carried
  # that unchecked and nobody pressed the button; `gh run rerun` works, on
  # completed and on expired runs alike, and refuses with exit 1 and a message
  # when an attempt is already in flight.
  #
  # The second was mine: that `rerun` failed silently on expired runs. It does
  # not. I ran it, then read a `gh run list` that did not contain the run I had
  # just re-run, and concluded from its absence that nothing had happened. The
  # attempt counter said otherwise the whole time.
  #
  # What survives both is the distinction that actually earns this trigger:
  # `rerun` replays *that run*, and every case here wanted the *current tree*
  # examined again. Those are different questions, and only one of them is
  # answered by re-running something from an hour ago.
  #
  # It also separates two states that look alike from outside — *this tree is
  # broken* and *that run was unlucky* — which cannot be told apart while
  # re-running needs a new commit, because a new commit is a different tree.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web frontend
        run: bun run build:web

      - name: Unit tests
        run: bun test packages/

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Integration tests start real hub and http processes on ephemeral ports.
      # Kept as a separate step so a failure here is distinguishable at a glance
      # from a unit failure — they fail for very different reasons.
      - name: Integration tests
        run: bun test test/

      # The guards checked against the defects they exist for. Moving these into
      # the repository was supposed to make "this was mutation-tested" a
      # checkable claim; a manifest nothing runs decays exactly the way the
      # documentation it replaced did.
      #
      # It edits tracked files and restores with `git checkout --`, which is
      # safe on a fresh checkout and refuses outright on a dirty tree.
      - name: Mutation check
        run: bun run mutation-check

      # The tool checking its own reporting branch. Added after `18/18 caught`
      # was reported while the code that prints a failure had never run.
      - name: Mutation check — self-check
        run: bun run mutation-check -- --self-check
