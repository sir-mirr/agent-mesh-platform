name: CI

on:
  push:
    branches: [main]
  pull_request:

  # **A green nobody can re-request is a green nobody can re-check.**
  #
  # Without this the only way to run CI again is to make a commit, so every
  # re-check costs a change to the thing being checked. Three situations today
  # needed one: a run that expired on the job budget with nothing to show, a
  # mutation entry that passed locally and failed here, and an install that
  # behaved differently on the runner than on any machine that could observe it.
  #
  # It also separates two questions that look alike from the outside — *is this
  # tree broken* and *was that run unlucky* — which cannot be told apart when
  # re-running requires a new tree.
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test packages/

      # Integration tests start real hub and http processes on ephemeral ports.
      # Kept as a separate step so a failure here is distinguishable at a glance
      # from a unit failure — they fail for very different reasons.
      - name: Integration tests
        run: bun test test/

      # The guards checked against the defects they exist for. Moving these into
      # the repository was supposed to make "this was mutation-tested" a
      # checkable claim; a manifest nothing runs decays exactly the way the
      # documentation it replaced did.
      #
      # It edits tracked files and restores with `git checkout --`, which is
      # safe on a fresh checkout and refuses outright on a dirty tree.
      - name: Mutation check
        run: bun run mutation-check

      # The tool checking its own reporting branch. Added after `18/18 caught`
      # was reported while the code that prints a failure had never run.
      - name: Mutation check — self-check
        run: bun run mutation-check -- --self-check
