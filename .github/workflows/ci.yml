name: CI

on:
  push:
    branches: [main]
  pull_request:

  # **Re-run the current tree, without committing to it.**
  #
  # That is the whole reason, and it took two wrong ones to get here.
  #
  # The first was that CI could not be re-requested at all. Three agents carried
  # that unchecked and nobody pressed the button; `gh run rerun` works, on
  # completed and on expired runs alike, and refuses with exit 1 and a message
  # when an attempt is already in flight.
  #
  # The second was mine: that `rerun` failed silently on expired runs. It does
  # not. I ran it, then read a `gh run list` that did not contain the run I had
  # just re-run, and concluded from its absence that nothing had happened. The
  # attempt counter said otherwise the whole time.
  #
  # What survives both is the distinction that actually earns this trigger:
  # `rerun` replays *that run*, and every case here wanted the *current tree*
  # examined again. Those are different questions, and only one of them is
  # answered by re-running something from an hour ago.
  #
  # It also separates two states that look alike from outside — *this tree is
  # broken* and *that run was unlucky* — which cannot be told apart while
  # re-running needs a new commit, because a new commit is a different tree.
  workflow_dispatch:

  # The mutation manifest, nightly. A full pass is hours (below), so it belongs
  # on a clock rather than in front of a merge.
  schedule:
    - cron: "0 17 * * *"

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # --frozen-lockfile: CI installs what the lockfile says or fails. A run
      # that silently resolves something else is not testing what will ship.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build web frontend
        run: bun run build:web

      - name: Unit tests
        run: bun test packages/

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # Integration tests start real hub and http processes on ephemeral ports.
      # Kept as a separate step so a failure here is distinguishable at a glance
      # from a unit failure — they fail for very different reasons.
      - name: Integration tests
        run: bun test test/

      # **Anchors, not the whole manifest.** This reads every entry against the
      # tree and answers in a second: an entry whose `from` no longer appears
      # plants nothing, the suite passes, and the run reads as *the guard did
      # not catch it* — a false finding rather than a missing one. Every
      # refactor in this repository has broken one, and it is the failure a
      # ten-minute job can actually hold.
      #
      # Planting them is the `mutation` job below, and it is not here for a
      # reason this step used to hide: a full pass is one suite per entry and
      # seventy-two of those entries name the browser suite, so it could not
      # have finished inside this job on any tree. It never had the chance to
      # say so — for fifteen pushes something above it failed first.
      - name: Mutation anchors
        run: bun run mutation-check -- --anchors

      # The tool checking its own reporting branch — three entries, seconds.
      # Added after `18/18 caught` was reported while the code that prints a
      # failure had never run.
      - name: Mutation check — self-check
        run: bun run mutation-check -- --self-check

      # **A step `verify.ts` runs and CI did not.** The inventory fails when its
      # two readings of the scenario list disagree — an unreadable header, a
      # phrase naming two scenarios, an exemption that has gone stale — and it
      # ran only where somebody happened to run `verify`. Anyone landing a
      # scenario through CI got a green tree from a check that never looked.
      # `ci-covers-verify.test.ts` now refuses the two lists drifting again.
      - name: Scenario inventory
        run: bun scripts/scenario-anchors.ts --json

  # **D-749's reopen condition, given something that fires it.**
  #
  # The coverage track closed on a number with a condition attached: any
  # measurement below 99 on either metric reopens it, without a new
  # instruction. Nothing here ran `scripts/coverage.ts`, so the condition could
  # only be reached by somebody choosing to go looking for it — which is not a
  # condition, it is a habit, and habits are what the mutation manifest and the
  # preview lint were both moved into CI to stop relying on.
  #
  # Its own job, on `main` only, for two reasons that pull the same way.
  # Coverage has to run `packages/` and `test/` in *one* process — Bun's report
  # covers the process it ran in, and the paths a spawned service takes are
  # uninstrumented rather than uncovered — so this duplicates both suites and
  # roughly doubles the wall clock. On a pull request that is pure latency
  # against a number that cannot move until the merge; on `main` it is the
  # measurement itself. Separate also means a fall is its own red check, rather
  # than a suite failure with a different cause and the same colour.
  coverage-floor:
    # After the suite, not beside it. The script refuses to report a number
    # about a tree that does not pass, so on a red `main` this job spends
    # twenty minutes arriving at what `check` already said — and while it runs,
    # the run is still in progress and `gh run view --log-failed` answers
    # "logs will be available when it is complete", which is how the first red
    # main since this landed took ten minutes to read.
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # Both of these are the integration suite's, not the measurement's: the
      # scenarios drive a real browser against the built frontend, and without
      # them the run is red before it is anything else.
      - name: Build web frontend
        run: bun run build:web

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # `--floor 99` exits non-zero below the number, naming which metric fell.
      # The script refuses to report at all on a red tree, so a failure here is
      # always one of the two: the suite broke, or the number did.
      # The record it reads is `coverage-floor.json`, and the run raises it
      # whenever the measurement is higher — failing when it does, because the
      # raise is written into this checkout and this checkout is thrown away.
      # A ratchet that raised quietly here would raise nothing.
      - name: Coverage floor
        run: bun scripts/coverage.ts --ratchet coverage-floor.json

  # **Planting the whole manifest, on a clock.**
  #
  # One suite per entry, and seventy-two of them name `test/fe-render.test.ts`,
  # which drives a browser for five minutes. That is hours however it is
  # arranged, which is why it is not in front of a push: the wait would be paid
  # by every merge, against a manifest that changes when a guard changes rather
  # than when a feature does.
  #
  # Sharded round-robin because the manifest is grouped by subject and the
  # expensive suites cluster inside a group — a contiguous eighth would hand one
  # shard every browser entry and another none. `fail-fast: false`, because
  # which *other* shards were also red is the first thing a reader wants.
  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # **The token could not have filed anything.** This repository's default
    # workflow permission is `read` (`gh api …/actions/permissions/workflow`
    # answers `default_workflow_permissions=read`) and nothing here asked for
    # more, so `gh issue create` in the step below had no scope to create with.
    # The first red nightly reported `could not add label` and the label was
    # indeed missing; creating it was necessary and not sufficient, and the
    # second red run — this one, dispatched to watch it — filed nothing again.
    #
    # A workflow may ask for more than the default, and this job asks for the
    # one thing its alarm needs.
    permissions:
      contents: read
      issues: write

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # The browser entries need both, for the same reason the integration
      # suite does.
      - name: Build web frontend
        run: bun run build:web

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # It edits tracked files and restores with `git checkout --`, which is
      # safe on a fresh checkout and refuses outright on a dirty tree.
      # Written down as well as printed. The log is what `scenario-anchors.ts
      # --from-log` reads to turn *pinned* into *observed*, and the summary job
      # below cannot do that from a run's console output. `pipefail` is on by
      # default in these shells, so `tee` does not swallow the exit code.
      - name: Mutation check
        run: bun run mutation-check -- --shard ${{ matrix.shard }}/8 | tee mutation-shard-${{ matrix.shard }}.log

      # `always()`: a shard that went red still measured seven eighths of its
      # entries, and the night's reading is worth more with them than without.
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-log-${{ matrix.shard }}
          path: mutation-shard-${{ matrix.shard }}.log
          retention-days: 14

      # **A nightly nobody reads is not a check.** `agent-mesh-local-pm` made
      # that the condition for moving the pass off the push path, and they are
      # describing something this repository has already lived: `main` was red
      # for fifteen consecutive pushes with nobody looking.
      #
      # So a red shard files an issue. It is durable, it is in the repository
      # rather than in a run somebody has to think to open, and `gh issue list
      # --label nightly-mutation` answers in a second — which is the command
      # `CLAUDE.md` now tells every session to run before it starts work.
      #
      # One issue per shard per night, and the body carries the run URL. A
      # second failure the next night files a second issue rather than silently
      # updating one, because "still broken" and "broken again" are different
      # facts and the count is the visible one.
      # **The alarm has to survive the alarm's own dependencies.**
      #
      # This step read as done for as long as the nightly had never gone red,
      # and the first time it did — every shard, on `cf6e44f` — it filed
      # nothing: `could not add label: 'nightly-mutation' not found`. A label
      # this repository had never been given, named in a workflow, in a step
      # nothing had ever run. `CLAUDE.md` told each session to read those
      # issues; there were none to read, and no way to tell that from a quiet
      # night.
      #
      # So the label is ensured here rather than assumed, and the issue is
      # filed without it if that still fails. A labelled issue is nicer; an
      # issue is the point.
      - name: File the failure where somebody will read it
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/nightly-mutation-body.md <<'BODY'
          Shard ${{ matrix.shard }} of 8 failed on `${{ github.sha }}`.

          A mutation that is not caught means the guard named in the entry no
          longer holds — the defect it was written against would now reach a
          release. The run says which entry and what its suite printed:

          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Reproduce one entry locally with `bun run mutation-check -- <id>`.
          BODY

          gh label create nightly-mutation \
            --color B60205 \
            --description "A nightly mutation shard came back red: a guard named in the manifest no longer holds" \
            || echo "the label already exists, or could not be created — filing anyway"

          title="nightly mutation shard ${{ matrix.shard }}/8 is red"
          gh issue create --title "$title" --label nightly-mutation --body-file /tmp/nightly-mutation-body.md \
            || gh issue create --title "$title" --body-file /tmp/nightly-mutation-body.md

  # **What the night actually observed.**
  #
  # `scenario-anchors.ts` keeps a claim and a verdict apart: an entry *pins* a
  # scenario the moment somebody writes it, and whether that mutation takes the
  # scenario down is known only after a run. Nothing carried a run's answer
  # back, so the pinned count — 174 of 175 — had never been confronted with an
  # observation, and reading it as proven is the error the file was written to
  # name.
  #
  # Eight shards, read together. One shard's log answers for an eighth of the
  # manifest; a night is measured only when all eight are in the same reading.
  #
  # It fails only when every shard was green and the two numbers still
  # disagree, because that is the case with no other explanation: if every
  # entry was caught, every scenario an entry pins must have been observed. A
  # red shard already filed its own issue and is not made louder here.
  observed:
    needs: mutation
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-log-*
          path: mutation-logs

      - name: What the night observed
        env:
          SHARDS_GREEN: ${{ needs.mutation.result == 'success' }}
        run: |
          logs=$(find mutation-logs -name '*.log' | sort)
          echo "logs read:"; echo "$logs"
          count=$(echo "$logs" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "no shard log was kept — the reading below would be about nothing"
            exit 1
          fi
          args=""
          for log in $logs; do args="$args --from-log $log"; done
          bun scripts/scenario-anchors.ts $args | tee /tmp/observed.txt
          bun scripts/scenario-anchors.ts $args --json > /tmp/observed.json
          pinned=$(bun -e 'const j = await Bun.file("/tmp/observed.json").json(); console.log(j.pinned)')
          seen=$(bun -e 'const j = await Bun.file("/tmp/observed.json").json(); console.log(j.observed)')
          echo "pinned $pinned · observed $seen · shards green: $SHARDS_GREEN"
          if [ "$SHARDS_GREEN" = "true" ] && [ "$seen" -lt "$pinned" ]; then
            echo "every shard passed and $((pinned - seen)) pinned scenario(s) were never observed — the pin does not reach the entry that claims it"
            exit 1
          fi
